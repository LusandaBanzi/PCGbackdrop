<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCG Women's Month Welcome Screen</title>

<style>

/* =========================================
   GENERAL SETTINGS
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}


/* =========================================
   WOMEN'S MONTH BACKGROUND
   Pink • Purple • Lavender • Gold • Cream
========================================= */

body{
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
    color:white;

    background:linear-gradient(
        -45deg,
        #3d1638,
        #6b245d,
        #a23b72,
        #d85c9c,
        #f2a7c6,
        #f7d9e6,
        #d7a8d8,
        #8d4c8d,
        #4a1744
    );

    background-size:500% 500%;

    animation:gradientShift 22s ease infinite;
}

@keyframes gradientShift{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* =========================================
   SOFT CENTRAL GLOW
========================================= */

.glow{
    position:absolute;

    width:65vw;
    height:65vw;

    max-width:1000px;
    max-height:1000px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,230,240,.45),
            rgba(255,174,210,.28),
            rgba(207,121,180,.18),
            transparent 70%
        );

    z-index:0;

    animation:glowPulse 8s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,
    100%{
        opacity:.7;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.18);
    }

}


/* =========================================
   HEADER
========================================= */

.header{
    position:absolute;

    top:2vh;
    left:2vw;

    display:flex;
    align-items:center;

    gap:2vw;

    z-index:30;

    max-width:80vw;
}


/* =========================================
   ANIMATED LOGO FLOWER AREA
========================================= */

.logo-flower-frame{
    position:relative;

    width:190px;
    height:155px;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}


/* =========================================
   PCG LOGO
========================================= */

.logo{
    position:relative;

    width:125px;
    height:100px;

    object-fit:contain;

    z-index:5;

    border-radius:50%;

    filter:
        drop-shadow(0 0 10px rgba(255,255,255,.8))
        drop-shadow(0 0 25px rgba(255,182,193,.8));
}


/* =========================================
   FLOWER POSITIONS AROUND LOGO
========================================= */

.logo-flower{
    position:absolute;

    font-size:3vw;

    z-index:10;

    animation:
        flowerFloat 4s ease-in-out infinite,
        flowerRotate 10s linear infinite;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.8));
}

.flower1{
    top:-5px;
    left:5px;

    animation-delay:0s;
}

.flower2{
    top:-12px;
    right:10px;

    animation-delay:1s;
}

.flower3{
    bottom:-5px;
    left:0;

    animation-delay:2s;
}

.flower4{
    bottom:-10px;
    right:5px;

    animation-delay:3s;
}

.flower5{
    top:40%;
    left:-18px;

    animation-delay:1.5s;
}

.flower6{
    top:40%;
    right:-18px;

    animation-delay:2.5s;
}


@keyframes flowerFloat{

    0%,
    100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-8px) scale(1.18);
    }

}

@keyframes flowerRotate{

    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }

}


/* =========================================
   SPARKLES AROUND LOGO
========================================= */

.logo-sparkle{
    position:absolute;

    color:#fff6c9;

    font-size:1.3vw;

    z-index:15;

    animation:sparkle 1.8s ease-in-out infinite alternate;
}

.spark1{
    top:0;
    left:45%;
}

.spark2{
    right:-8px;
    top:20%;
    animation-delay:.5s;
}

.spark3{
    left:-8px;
    bottom:20%;
    animation-delay:1s;
}

.spark4{
    bottom:-5px;
    left:50%;
    animation-delay:1.4s;
}

@keyframes sparkle{

    from{
        opacity:.2;
        transform:scale(.5) rotate(0deg);
    }

    to{
        opacity:1;
        transform:scale(1.6) rotate(180deg);
    }

}


/* =========================================
   CHURCH NAME
========================================= */

.church-name{

    font-size:3.4vw;

    font-weight:1000;

    letter-spacing:2px;

    text-transform:uppercase;

    line-height:1.15;

    color:#fff4f8;

    -webkit-text-stroke:1px #8c2766;

    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 20px rgba(255,157,205,.8),
        0 0 35px rgba(126,40,107,.6),
        3px 3px 6px rgba(0,0,0,.4);
}


/* =========================================
   LARGE FLORAL BACKGROUND DECORATIONS
========================================= */

.bg-flower{
    position:absolute;

    font-size:7vw;

    opacity:.18;

    z-index:1;

    animation:bgFlowerFloat 15s ease-in-out infinite;
}

.bg-flower.f1{
    top:12%;
    left:8%;
}

.bg-flower.f2{
    top:15%;
    right:10%;

    animation-delay:3s;
}

.bg-flower.f3{
    bottom:10%;
    left:12%;

    animation-delay:6s;
}

.bg-flower.f4{
    bottom:8%;
    right:8%;

    animation-delay:9s;
}

@keyframes bgFlowerFloat{

    0%,
    100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-40px) rotate(30deg);
    }

}


/* =========================================
   FLOATING PETALS
========================================= */

.petal{
    position:absolute;

    font-size:2vw;

    z-index:3;

    opacity:.75;

    animation:petalFall linear infinite;

    pointer-events:none;
}

.petal1{
    left:8%;
    top:-10%;

    animation-duration:13s;
}

.petal2{
    left:22%;
    top:-20%;

    animation-duration:17s;
    animation-delay:2s;
}

.petal3{
    left:45%;
    top:-15%;

    animation-duration:15s;
    animation-delay:4s;
}

.petal4{
    left:68%;
    top:-20%;

    animation-duration:19s;
    animation-delay:1s;
}

.petal5{
    left:85%;
    top:-15%;

    animation-duration:14s;
    animation-delay:5s;
}

@keyframes petalFall{

    0%{
        transform:
            translateY(-10vh)
            translateX(0)
            rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(115vh)
            translateX(10vw)
            rotate(720deg);

        opacity:0;
    }

}


/* =========================================
   FLOATING LIGHT SHAPES
========================================= */

.shape{
    position:absolute;

    border-radius:50%;

    filter:blur(8px);

    opacity:.5;

    z-index:2;

    mix-blend-mode:screen;
}

.s1{
    width:16vw;
    height:16vw;

    background:
        radial-gradient(
            circle,
            #ffb6d5,
            transparent 70%
        );

    top:22%;
    left:12%;

    animation:float1 14s ease-in-out infinite;
}

.s2{
    width:20vw;
    height:20vw;

    background:
        radial-gradient(
            circle,
            #d48ac2,
            transparent 70%
        );

    bottom:15%;
    right:10%;

    animation:float2 18s ease-in-out infinite;
}

.s3{
    width:12vw;
    height:12vw;

    background:
        radial-gradient(
            circle,
            #f8d8e8,
            transparent 70%
        );

    top:28%;
    right:22%;

    animation:float3 12s ease-in-out infinite;
}

.s4{
    width:15vw;
    height:15vw;

    background:
        radial-gradient(
            circle,
            #fff0c9,
            transparent 70%
        );

    bottom:20%;
    left:8%;

    animation:float2 20s ease-in-out infinite reverse;
}

@keyframes float1{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5vh);
    }

}

@keyframes float2{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5vh);
    }

}

@keyframes float3{

    0%,
    100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(-5vw);
    }

}


/* =========================================
   WOMEN'S MONTH MESSAGE
========================================= */

.women-message{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    width:90%;

    text-align:center;

    z-index:10;
}

.women-message h1{

    font-size:6vw;

    font-weight:900;

    letter-spacing:8px;

    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            #fff4f8,
            #ffd1e5,
            #f8b6d4,
            #fff4f8,
            #ffe4a8,
            #fff4f8
        );

    background-size:300% 100%;

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        textShine 10s linear infinite,
        messagePulse 4s ease-in-out infinite;

    filter:
        drop-shadow(0 0 25px rgba(255,184,215,.7));
}

.women-message p{

    margin-top:2vh;

    font-size:2vw;

    font-weight:600;

    letter-spacing:4px;

    color:#fff4f8;

    text-shadow:
        0 0 15px rgba(255,153,204,.8);
}

@keyframes textShine{

    from{
        background-position:0% 50%;
    }

    to{
        background-position:300% 50%;
    }

}

@keyframes messagePulse{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }

}


/* =========================================
   FOOTER
========================================= */

.footer{
    position:absolute;

    bottom:3vh;

    width:100%;

    text-align:center;

    font-size:2.5vw;

    font-weight:600;

    letter-spacing:2px;

    color:#fff5f8;

    z-index:20;

    text-shadow:
        0 0 12px rgba(110,25,83,.8);
}


/* =========================================
   RESPONSIVE ADJUSTMENTS
========================================= */

@media(max-width:900px){

    .logo-flower-frame{
        width:150px;
        height:130px;
    }

    .logo{
        width:100px;
        height:85px;
    }

    .logo-flower{
        font-size:4vw;
    }

    .church-name{
        font-size:4vw;
    }

  

}

</style>
</head>

<body>


<!-- CENTRAL GLOW -->

<div class="glow"></div>


<!-- LARGE BACKGROUND FLOWERS -->

<div class="bg-flower f1">🌸</div>
<div class="bg-flower f2">🌺</div>
<div class="bg-flower f3">🌷</div>
<div class="bg-flower f4">🌸</div>


<!-- FALLING PETALS -->

<div class="petal petal1">🌸</div>
<div class="petal petal2">🌺</div>
<div class="petal petal3">🌷</div>
<div class="petal petal4">🌸</div>
<div class="petal petal5">🌺</div>


<!-- HEADER -->

<div class="header">


    <!-- FLOWERS SURROUNDING THE LOGO -->

    <div class="logo-flower-frame">


        <div class="logo-flower flower1">🌸</div>
        <div class="logo-flower flower2">🌺</div>
        <div class="logo-flower flower3">🌷</div>
        <div class="logo-flower flower4">🌸</div>
        <div class="logo-flower flower5">🌼</div>
        <div class="logo-flower flower6">🌺</div>


        <!-- SPARKLES -->

        <div class="logo-sparkle spark1">✦</div>
        <div class="logo-sparkle spark2">✦</div>
        <div class="logo-sparkle spark3">✦</div>
        <div class="logo-sparkle spark4">✦</div>


        <!-- PCG LOGO -->

        <img
            src="pcglogo.png"
            class="logo"
            alt="Church Logo"
            onerror="this.style.display='none'"
        >


    </div>


    <!-- CHURCH NAME -->

    <div class="church-name">

        THE PENTECOSTAL CHURCH OF GOD

    </div>


</div>


<!-- FLOATING LIGHTS -->

<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>
<div class="shape s4"></div>


<!-- FOOTER -->

<div class="footer">

    We exist to be heavenly bound, edify the church and evangelize the world.

</div>


<script>

/* =========================================
   SOFT RANDOM BLUR ANIMATION
========================================= */

const shapes =
    document.querySelectorAll(".shape");

setInterval(() => {

    shapes.forEach(shape => {

        shape.style.filter =
            `blur(${5 + Math.random() * 8}px)`;

    });

},2500);


/* =========================================
   RANDOM SPARKLE SIZE EFFECT
========================================= */

const sparkles =
    document.querySelectorAll(".logo-sparkle");

setInterval(() => {

    sparkles.forEach(sparkle => {

        const size =
            0.8 + Math.random() * 0.8;

        sparkle.style.transform =
            `scale(${size})`;

    });

},1800);

</script>

</body>
</html>
