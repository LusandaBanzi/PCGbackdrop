<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCG | Church Announcements</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden}
    :root{
      --white:#ffffff;
      --muted:#8a9bb5;
      --accent:#c9a84c;
      --gold:#c9a84c;
      --gold-light:#e0c878;
      --navy-deep:#0a1628;
      --navy-mid:#0f1f35;
      --navy-panel:#132842;
      --ease:cubic-bezier(.22,1,.36,1);
      --ease-io:cubic-bezier(.76,0,.24,1);
      --announcement-title-size:clamp(78px,9vw,150px);
      --announcement-line-width:min(38vw,520px);
    }
    body{
      font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;
      color:var(--white);position:relative;background:#0a1628;
      perspective:1400px;
      transform-style:preserve-3d;
    }

    /* ============ PREMIUM BACKGROUND — NAVY THEME ============ */
    .bg{position:absolute;inset:0;z-index:0;overflow:hidden;
      background:
        radial-gradient(ellipse at 50% 120%,rgba(201,168,76,.12),transparent 55%),
        linear-gradient(160deg,#0a1628 0%,#0f1f35 45%,#0a1628 100%)}

    /* Floating orbs — navy & gold tinted */
    .orb{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
    .o1{width:62vmax;height:62vmax;left:-18vmax;top:-24vmax;background:radial-gradient(circle,rgba(30,80,150,.50),transparent 65%);animation:d1 26s ease-in-out infinite alternate}
    .o2{width:56vmax;height:56vmax;right:-20vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(201,168,76,.28),transparent 65%);animation:d2 30s ease-in-out infinite alternate}
    .o3{width:44vmax;height:44vmax;left:38%;top:28%;background:radial-gradient(circle,rgba(50,90,160,.25),transparent 65%);animation:d3 34s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate3d(40vw,30vh,0) scale(1.2)}}
    @keyframes d2{to{transform:translate3d(-38vw,-26vh,0) scale(1.15)}}
    @keyframes d3{to{transform:translate3d(-30vw,24vh,0) scale(1.3)}}

    /* Halo breathing */
    .halo{position:absolute;inset:0;
      background:radial-gradient(ellipse 55% 65% at 50% -12%,rgba(201,168,76,.15),transparent 72%);
      animation:breathe 9s ease-in-out infinite alternate}
    @keyframes breathe{from{opacity:.55}to{opacity:1}}

    /* Rotating rings — gold tinted */
    .ring{position:absolute;left:50%;top:50%;border-radius:50%;
      border:1px solid rgba(201,168,76,.06);border-top-color:rgba(201,168,76,.35);
      translate:-50% -50%}
    .r1{width:84vmin;height:84vmin;animation:spin 80s linear infinite}
    .r2{width:112vmin;height:112vmin;border-top-color:rgba(30,80,150,.25);animation:spin 120s linear infinite reverse}
    @keyframes spin{to{rotate:360deg}}

    /* Premium floating particles */
    .particles{position:absolute;inset:0;pointer-events:none;z-index:1}
    .particle{position:absolute;border-radius:50%;background:var(--gold);opacity:0;
      animation:float-up var(--dur,14s) linear infinite;will-change:transform,opacity;
      box-shadow:0 0 10px rgba(201,168,76,.6)}
    @keyframes float-up{
      0%{opacity:0;transform:translateY(0) scale(.3)}
      10%{opacity:.7}
      90%{opacity:.7}
      100%{opacity:0;transform:translateY(-110vh) scale(1)}
    }

    /* Grain + vignette */
    .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
    .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 45%,rgba(5,10,20,.7) 100%)}

    /* ============ HEADER — MATCHING PHOTO ============ */
    .header{
      position:absolute;top:0;left:0;width:100%;height:14vh;
      display:flex;align-items:center;gap:1.4vw;
      padding:1.6vh 3.5vw;z-index:20;
      background:linear-gradient(180deg,rgba(10,22,40,.95) 0%,rgba(10,22,40,.0) 100%);
      border-bottom:1px solid rgba(201,168,76,.15);
      animation:headerIn 1.2s var(--ease) both;
    }
    @keyframes headerIn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
    .logo{width:6.2vw;min-width:64px;max-width:94px;height:9vh;object-fit:contain;filter:drop-shadow(0 5px 14px rgba(0,0,0,.45))}

    /* Church name — WHITE BOLD like the photo */
    .church-name{
      font-family:Inter,Segoe UI,Arial,sans-serif;
      font-size:clamp(22px,2.2vw,38px);
      font-weight:900;
      letter-spacing:.12em;
      white-space:nowrap;
      max-width:58vw;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#ffffff;
      text-shadow:0 2px 6px rgba(0,0,0,.7);
      text-transform:uppercase;
    }

    /* ============ CENTER STAGE ============ */
    .stage{
      position:absolute;
      inset:14vh 0 13vh;
      z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2.5vh;
      text-align:center;
      padding:0 6vw;
      transform-style:preserve-3d;
    }

    /* Main title — GOLD like the "OVER..." heading */
    .main-title{
      font-family:Inter,Segoe UI,Arial,sans-serif;
      font-size:var(--announcement-title-size);
      font-weight:900;
      letter-spacing:.06em;
      line-height:1.05;
      color:var(--gold);
      text-transform:uppercase;
      text-shadow:0 4px 20px rgba(0,0,0,.6);
      transform-origin:center;
      animation:titleReveal 2.2s var(--ease-io) both;
    }
    @keyframes titleReveal{
      0%{opacity:0;transform:translateY(80px) scale(.85) rotateX(25deg);filter:blur(12px)}
      60%{opacity:1;filter:blur(0)}
      100%{opacity:1;transform:translateY(0) scale(1) rotateX(0);filter:blur(0)}
    }

    /* Accent line — gold with diamond center like the photo */
    .accent-line{
      position:relative;
      width:0;
      height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      animation:lineGrow 1.8s var(--ease) 1s forwards;
    }
    .accent-line::after{
      content:"◆";
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-50%);
      font-size:14px;
      color:var(--gold);
      opacity:0;
      animation:diamondIn .6s var(--ease) 2.2s forwards;
    }
    @keyframes lineGrow{to{width:var(--announcement-line-width)}}
    @keyframes diamondIn{to{opacity:1}}

    /* Subtitle */
    .subtitle{
      font-size:clamp(18px,1.8vw,32px);
      color:var(--muted);
      font-weight:400;
      letter-spacing:.1em;
      max-width:80vw;
      line-height:1.5;
      opacity:0;
      animation:subtitleIn 1.6s var(--ease) 1.6s forwards;
    }
    @keyframes subtitleIn{
      from{opacity:0;transform:translateY(30px) scale(.96);filter:blur(6px)}
      to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
    }

    /* ============ ANNOUNCEMENT CARDS — DARK NAVY LIKE PHOTO ============ */
    .announcements{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1.8vw;
      margin-top:3vh;
      width:100%;
      max-width:1100px;
      perspective:1000px;
    }
    .ann-item{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:.4em;
      padding:2.2vh 2.5vw;
      border-radius:4px;
      background:#0d1a2e;
      border:1px solid rgba(201,168,76,.25);
      border-left:3px solid var(--gold);
      opacity:0;
      transform-style:preserve-3d;
      animation:annReveal .9s var(--ease) var(--delay,2.2s) forwards;
      box-shadow:0 8px 30px rgba(0,0,0,.4);
      text-align:left;
    }
    @keyframes annReveal{
      from{opacity:0;transform:translateY(50px) rotateX(-15deg) scale(.92)}
      to{opacity:1;transform:translateY(0) rotateX(0) scale(1)}
    }
    .ann-item .label{
      display:flex;
      align-items:center;
      gap:.5em;
      font-size:clamp(13px,1vw,17px);
      font-weight:800;
      letter-spacing:.18em;
      color:var(--gold);
      text-transform:uppercase;
    }
    .ann-item .label::before{
      content:"◆";
      font-size:.7em;
      color:var(--gold);
    }
    .ann-item .value{
      font-size:clamp(20px,2vw,34px);
      font-weight:700;
      letter-spacing:.01em;
      line-height:1.25;
      color:#ffffff;
      text-shadow:0 2px 6px rgba(0,0,0,.5);
    }

    /* ============ FOOTER — SOLID NAVY BAR LIKE PHOTO ============ */
    .footer{
      position:absolute;
      bottom:0;left:0;width:100%;
      z-index:20;
      text-align:center;
      padding:2.4vh 6vw 2.2vh;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      font-size:clamp(16px,1.8vw,30px);
      font-weight:800;
      line-height:1.35;
      letter-spacing:.08em;
      color:#ffffff;
      text-transform:uppercase;
      text-shadow:0 2px 6px rgba(0,0,0,.7);
      background:#0d1a2e;
      border-top:2px solid rgba(201,168,76,.4);
      opacity:0;
      animation:footerIn 1.4s var(--ease) 2.8s forwards;
    }
    @keyframes footerIn{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* ============ RESPONSIVE ============ */
    @media(max-width:900px){
      .stage{padding:0 4vw;gap:1.8vh}
      .main-title{font-size:clamp(42px,10vw,80px)}
      .announcements{grid-template-columns:1fr;gap:1.2vh}
      .ann-item{padding:1.5vh 4vw}
      .ann-item .value{font-size:clamp(16px,3.4vw,22px)}
      .church-name{font-size:clamp(14px,2.4vw,22px);max-width:70vw;letter-spacing:.08em}
      .footer{font-size:clamp(12px,2.6vw,18px);letter-spacing:.05em}
    }

    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      .particle{display:none}
    }
  </style>
</head>
<body>

<!-- PREMIUM NAVY BACKGROUND -->
<div class="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="halo"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="grain"></div>
</div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Vignette overlay -->
<div class="vignette"></div>

<!-- HEADER -->
<header class="header">
  <img src="assets/images/pcglogo.png" class="logo" alt="The Pentecostal Church of God" decoding="async" loading="eager">
  <div class="church-name">THE PENTECOSTAL CHURCH OF GOD</div>
</header>



<script>
  /* =========================================================
     FLOATING PARTICLES — premium ambient motion
     ========================================================= */
  (function(){
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const container = document.getElementById('particles');
    const count = 40;
    for(let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1.5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.bottom = '-20px';
      p.style.setProperty('--dur', (10 + Math.random() * 16) + 's');
      p.style.animationDelay = (Math.random() * 18) + 's';
      const tint = Math.random() < 0.5
        ? 'rgba(201,168,76,'
        : 'rgba(120,170,230,';
      p.style.background = tint + (0.4 + Math.random() * 0.5) + ')';
      p.style.boxShadow = '0 0 ' + (6 + Math.random() * 10) + 'px ' + tint + '0.5)';
      container.appendChild(p);
    }
  })();
</script>

</body>

</html>
