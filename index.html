<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOLMIC | Heritage Theme Announcements</title>

<style>

/* =========================================================
   WOLMIC HERITAGE / CREAM PROJECTION THEME
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
    color:#211a15;
    background:#ead8ad;
}

/* Main warm cream canvas */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 45%, rgba(255,250,231,.92), transparent 38%),
        linear-gradient(135deg,#e8d5aa,#f5e9c9 45%,#dfc68e);
    z-index:0;
}



/* Header */
.header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:12%;
    display:flex;
    align-items:center;
    gap:1vw;
    padding:0 2vw;
    background:rgba(255,255,255,.97);
    border-bottom:5px solid #171717;
    z-index:100;
    box-shadow:0 4px 16px rgba(0,0,0,.14);
}

.logo-frame{
    position:relative;
    width:6.5vw;
    min-width:70px;
    max-width:105px;
    height:9vh;
    min-height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo-frame::before{
    content:"";
    position:absolute;
    inset:5%;
    border-radius:50%;
    background:radial-gradient(circle,#fffdf5,#ead8ad 68%,transparent 72%);
    box-shadow:0 0 18px rgba(194,157,74,.35);
    animation:logoHalo 4s ease-in-out infinite;
}

.logo{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));
    animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoHalo{
    0%,100%{transform:scale(.95);opacity:.65;}
    50%{transform:scale(1.08);opacity:1;}
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
}

/* Decorative logo petals are now subtle gold/heritage accents */
.logo-flower,
.petal{
    position:absolute;
    z-index:10;
    pointer-events:none;
}

.logo-flower{
    font-size:18px;
    filter:grayscale(1) sepia(1) saturate(2) hue-rotate(355deg);
    opacity:.65;
    animation:accentFloat 4s ease-in-out infinite;
}

.flower1{top:0;left:0}
.flower2{top:0;right:0;animation-delay:-1s}
.flower3{bottom:0;left:0;animation-delay:-2s}
.flower4{bottom:0;right:0;animation-delay:-3s}
.flower5,.flower6{display:none}

.petal{
    width:6px;
    height:12px;
    background:#d6ad4b;
    border-radius:80% 20%;
    box-shadow:0 0 7px rgba(214,173,75,.5);
    animation:petalFloat 5s ease-in-out infinite;
}

.petal1{top:8px;left:25%}
.petal2{top:8px;right:25%;animation-delay:-1s}
.petal3{bottom:8px;left:25%;animation-delay:-2s}
.petal4{bottom:8px;right:25%;animation-delay:-3s}

@keyframes accentFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-5px) rotate(8deg);}
}

@keyframes petalFloat{
    0%,100%{transform:translate(0,0) rotate(0);}
    50%{transform:translate(7px,-7px) rotate(120deg);}
}

/* Church name: fits cleanly on one line */
.church-name{
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(22px,3.0vw,58px);
    font-weight:900;
    letter-spacing:clamp(0px,.05vw,1.2px);
    line-height:1;
    text-transform:uppercase;
    color:#211a15;
    text-shadow:1px 1px 0 #fff,2px 3px 4px rgba(0,0,0,.16);
    animation:nameGlow 6s ease-in-out infinite;
}

@keyframes nameGlow{
    0%,100%{text-shadow:1px 1px 0 #fff,2px 3px 4px rgba(0,0,0,.16);}
    50%{text-shadow:1px 1px 0 #fff,0 0 10px rgba(202,162,75,.28),2px 3px 4px rgba(0,0,0,.16);}
}






@keyframes textPulse{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(8px);}
}




/* Heritage floating geometric shapes */
.shape{
    position:absolute;
    width:7vw;
    height:4.5vw;
    max-width:125px;
    max-height:78px;
    min-width:60px;
    min-height:38px;
    border:7px solid #111;
    clip-path:polygon(15% 0%,85% 0%,100% 50%,85% 100%,15% 100%,0 50%);
    z-index:8;
    box-shadow:0 6px 12px rgba(0,0,0,.18);
    animation:heritageShape 6s ease-in-out infinite;
}

.s1{background:#347db5;top:20%;left:2%;}
.s2{background:#f3b91c;bottom:20%;right:2%;animation-delay:-1.5s;}
.s3{background:#318343;top:28%;right:4%;animation-delay:-3s;}
.s4{background:#d32f3b;bottom:24%;left:3%;animation-delay:-4.5s;}

@keyframes heritageShape{
    0%,100%{transform:translateY(0) rotate(0) scale(1);}
    25%{transform:translateY(-12px) rotate(5deg) scale(1.05);}
    50%{transform:translateY(5px) rotate(-5deg) scale(1.1);}
    75%{transform:translateY(-7px) rotate(3deg) scale(1.04);}
}

/* Footer */
.footer{
    position:absolute;
    bottom:2.3vh;
    left:0;
    width:100%;
    text-align:center;
    font-size:clamp(16px,1.6vw,30px);
    font-weight:800;
    letter-spacing:.12vw;
    color:#33281f;
    z-index:90;
    text-transform:uppercase;
    text-shadow:1px 1px 0 #fff;
}

/* Extra heritage lines around the screen */
body::after{
    content:"";
    position:absolute;
    inset:12% 8.3% 13%;
    border:3px solid #171717;
    pointer-events:none;
    z-index:35;
}

/* Projection responsiveness */
@media(max-width:1200px){
    .church-name{
        font-size:2.55vw;
        letter-spacing:0;
    }

    .announcement-container{
        width:84%;
        height:61vh;
    }

    .announcement{
        gap:2vw;
    }

    .announcement img{
        width:47%;
    }

    .info h2{
        font-size:4.4vw;
    }

    .shape{
        width:6vw;
        height:4vw;
    }
}



</style>
</head>

<body>


<!-- CENTRAL GLOW -->
<div class="glow"></div>



<!-- HEADER -->
<div class="header">

    <div class="logo-frame">

        <img
            src="pcglogo.png"
            class="logo"
            alt="Church Logo"
            onerror="this.style.display='none'"
        >

        <span class="logo-flower flower1">🌸</span>
        <span class="logo-flower flower2">🌺</span>
        <span class="logo-flower flower3">🌷</span>
        <span class="logo-flower flower4">🌹</span>
        <span class="logo-flower flower5">🌼</span>
        <span class="logo-flower flower6">🌸</span>

        <span class="petal petal1"></span>
        <span class="petal petal2"></span>
        <span class="petal petal3"></span>
        <span class="petal petal4"></span>

    </div>


    <div class="church-name">
       THE PENTECOSTAL CHURCH OF GOD
    </div>

</div>





<!-- FLOATING BACKGROUND SHAPES -->
<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>
<div class="shape s4"></div>


<!-- FOOTER -->
<div class="footer">
    We exist to be heavenly bound, edify the church and evangelize the world.
</div>


<script>

/* ================================
   FLOATING SHAPES
================================ */
const shapes = document.querySelectorAll(".shape");

setInterval(() => {

    shapes.forEach(shape => {

        shape.style.filter =
            `blur(${4 + Math.random() * 6}px)`;

    });

}, 2500);


/* ================================
   ANNOUNCEMENT SLIDESHOW
================================ */
const slides =
    document.querySelectorAll(".announcement");

let currentSlide = 0;

slides[currentSlide].classList.add("active");

const slideShow = setInterval(() => {

    slides[currentSlide].classList.remove("active");

    currentSlide++;

    if(currentSlide >= slides.length){

        clearInterval(slideShow);

        return;
    }

    slides[currentSlide].classList.add("active");

    if(currentSlide === slides.length - 1){

        clearInterval(slideShow);
    }

}, 8000);

</script>

</body>
</html>
